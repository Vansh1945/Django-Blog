{% extends 'base.html' %}
{% block title %}Create Blog - MyBlogs{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <!-- Form Card Container -->
    <div class="bg-white rounded-3xl border border-slate-200/60 shadow-xl overflow-hidden">
        <!-- Form Header -->
        <div class="bg-gradient-to-r from-brand-600 to-indigo-600 py-10 px-8 sm:px-10 text-white relative">
            <div class="absolute inset-0 opacity-10">
                <div class="absolute top-0 right-0 w-[40%] h-[150%] rounded-full bg-white blur-[40px]"></div>
            </div>
            
            <div class="relative flex flex-col sm:flex-row sm:items-center sm:justify-between gap-6">
                <div>
                    <h1 class="text-3xl font-extrabold tracking-tight mb-2">Create New Blog Post</h1>
                    <p class="text-brand-100 text-sm">Draft and publish your thoughts to the community feed.</p>
                </div>
                <a href="{% url 'see_blog' %}" class="inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 text-white border border-white/20 px-4 py-2 rounded-xl text-sm font-semibold transition-all duration-200">
                    <i class="fas fa-arrow-left text-xs"></i> Your Blogs
                </a>
            </div>
        </div>
        
        <!-- Form Body -->
        <div class="p-8 sm:p-10">
            <form method="post" enctype="multipart/form-data" class="space-y-8">
                {% csrf_token %}
                
                <!-- Blog Title Field -->
                <div>
                    <label for="title" class="block text-sm font-semibold text-slate-700 mb-2">Blog Title</label>
                    <input type="text" 
                           id="title" 
                           name="title" 
                           class="block w-full px-4 py-3 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition duration-200 bg-slate-50/50 hover:bg-slate-50" 
                           placeholder="Enter an attention-grabbing title" 
                           required>
                </div>
                
                <!-- TinyMCE Rich Text Content -->
                <div class="form-rich-text">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Blog Content</label>
                    {{ form.media }}
                    {{ form.as_p }}
                </div>
                
                <!-- File Upload Drag & Drop Zone -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Featured Image</label>
                    <div class="relative">
                        <input type="file" id="blog-image" name="image" class="hidden" required>
                        <label for="blog-image" class="file-upload-label flex flex-col items-center justify-center py-10 px-6 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50/50 text-slate-400 text-center cursor-pointer transition-all duration-200 hover:border-brand-500 hover:bg-brand-50/20">
                            <i class="fas fa-cloud-upload-alt text-3xl mb-3 text-brand-500"></i>
                            <span class="font-bold text-slate-700 text-sm mb-1">Upload Featured Image</span>
                            <span class="text-xs text-slate-400">Drag and drop your file or click to browse (JPG, PNG)</span>
                        </label>
                    </div>
                </div>
                
                <!-- Submit -->
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3.5 px-4 rounded-xl font-bold transition-all duration-200 shadow-md shadow-brand-500/10 hover:shadow-lg hover:shadow-brand-500/20 flex items-center justify-center gap-2 active:scale-[0.99]">
                    <i class="fas fa-paper-plane text-brand-200 text-sm"></i> Publish Blog
                </button>
            </form>
        </div>
    </div>
</div>

<!-- Inline CSS to style standard Django-Tinymce fields inside forms -->
<style>
    .form-rich-text p {
        margin: 0 !important;
    }
    .django-ckeditor-widget, .tox-tinymce {
        border: 1px solid #e2e8f0 !important;
        border-radius: 12px !important;
        overflow: hidden !important;
        box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05) !important;
    }
</style>

<script>
    // File upload preview functionality
    const fileInput = document.getElementById('blog-image');
    const fileUploadLabel = document.querySelector('.file-upload-label');
    
    fileInput.addEventListener('change', function(e) {
        if (this.files && this.files[0]) {
            const reader = new FileReader();
            
            reader.onload = function(e) {
                fileUploadLabel.innerHTML = `
                    <div class="max-w-[200px] max-h-[120px] rounded-lg overflow-hidden border border-slate-100 shadow-sm mx-auto mb-3">
                        <img src="${e.target.result}" class="w-full h-full object-cover">
                    </div>
                    <span class="font-bold text-slate-800 text-sm mb-1">${fileInput.files[0].name}</span>
                    <span class="text-xs text-brand-600 font-semibold">Click to change image</span>
                `;
            }
            
            reader.readAsDataURL(this.files[0]);
        }
    });
    
    // Add drag and drop highlights
    fileUploadLabel.addEventListener('dragover', (e) => {
        e.preventDefault();
        fileUploadLabel.classList.add('border-brand-500', 'bg-brand-50/30');
    });
    
    fileUploadLabel.addEventListener('dragleave', () => {
        fileUploadLabel.classList.remove('border-brand-500', 'bg-brand-50/30');
    });
    
    fileUploadLabel.addEventListener('drop', (e) => {
        e.preventDefault();
        fileUploadLabel.classList.remove('border-brand-500', 'bg-brand-50/30');
        
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            const event = new Event('change');
            fileInput.dispatchEvent(event);
        }
    });
</script>
{% endblock %}
