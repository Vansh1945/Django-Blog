{% extends 'base.html' %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <!-- Back to Home Link -->
    <div class="mb-8">
        <a href="{% url 'home' %}" class="inline-flex items-center gap-2 text-slate-500 hover:text-brand-600 font-semibold transition-colors duration-200 group">
            <i class="fas fa-arrow-left text-sm group-hover:-translate-x-1 transition-transform"></i>
            Back to Home
        </a>
    </div>

    <!-- Article Header Card -->
    <article class="bg-white rounded-3xl border border-slate-100 shadow-xl shadow-slate-100/50 overflow-hidden">
        <!-- Featured Image with Fallback -->
        <div class="relative w-full aspect-[21/9] bg-slate-100 overflow-hidden">
            <img class="w-full h-full object-cover" 
                 src="{{ blog_obj.image.url }}" 
                 onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=1200&auto=format&fit=crop&q=80';"
                 alt="{{ blog_obj.title }}">
        </div>

        <div class="p-6 sm:p-10 lg:p-12">
            <!-- Category Tag -->
            <div class="mb-4">
                <span class="inline-flex items-center gap-1.5 bg-brand-50 text-brand-700 text-xs font-semibold px-3 py-1 rounded-full">
                    <i class="fas fa-feather-alt text-[10px]"></i> Publication
                </span>
            </div>

            <!-- Title -->
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight mb-6">
                {{ blog_obj.title }}
            </h1>

            <!-- Meta details -->
            <div class="flex flex-wrap items-center gap-4 pb-8 mb-8 border-b border-slate-100 text-sm">
                <!-- Author Info -->
                <div class="flex items-center gap-2.5">
                    <div class="flex items-center justify-center w-8 h-8 rounded-full bg-brand-600 text-white font-bold text-xs shadow-sm">
                        {{ blog_obj.user.username|slice:":1"|upper }}
                    </div>
                    <div>
                        <p class="font-semibold text-slate-900 leading-tight">By {{ blog_obj.user.username }}</p>
                    </div>
                </div>
                
                <span class="text-slate-300 hidden sm:inline">|</span>

                <!-- Date Info -->
                <div class="flex items-center gap-1.5 text-slate-500">
                    <i class="far fa-calendar"></i>
                    <span>Published on {{ blog_obj.created_at|date:"F d, Y \a\t g:i a" }}</span>
                </div>
            </div>

            <!-- Content Area -->
            <div class="rich-text-content text-slate-700 text-base sm:text-lg leading-relaxed space-y-6">
                {{ blog_obj.content|safe }}
            </div>
        </div>
    </article>
</div>

<!-- Inline styling for Rich Text rendered output -->
<style>
    .rich-text-content p {
        margin-bottom: 1.5rem;
    }
    .rich-text-content h2 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0f172a;
        margin-top: 2rem;
        margin-bottom: 1rem;
        letter-spacing: -0.025em;
    }
    .rich-text-content h3 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #0f172a;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
    }
    .rich-text-content ul, .rich-text-content ol {
        margin-left: 1.5rem;
        margin-bottom: 1.5rem;
        list-style-position: outside;
    }
    .rich-text-content ul {
        list-style-type: disc;
    }
    .rich-text-content ol {
        list-style-type: decimal;
    }
    .rich-text-content li {
        margin-bottom: 0.5rem;
    }
    .rich-text-content blockquote {
        border-left: 4px solid #7c3aed;
        background-color: #f5f3ff;
        padding: 1rem 1.5rem;
        margin: 1.5rem 0;
        border-radius: 0 8px 8px 0;
        font-style: italic;
        color: #4c1d95;
    }
</style>
{% endblock %}
