{% extends 'base.html' %}
{% block title %}Login - MyBlogs{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-10rem)] flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12 bg-slate-50">
    <div class="max-w-md w-full">
        <!-- Logo and Headings -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-brand-50 text-brand-600 mb-4 shadow-sm">
                <i class="fas fa-feather-alt text-2xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h2>
            <p class="text-sm text-slate-500 mt-2">Please sign in to manage your blog posts</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-3xl border border-slate-100 shadow-xl shadow-slate-100/40 p-8 sm:p-10">
            <form method="post" action="{% url 'login' %}" class="space-y-6">
                {% csrf_token %}
                
                {% if n %}
                <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-4 text-sm flex items-start gap-2.5">
                    <i class="fas fa-triangle-exclamation mt-0.5 text-amber-500"></i>
                    <span>{{ n }}</span>
                </div>
                {% endif %}

                <!-- Username Input -->
                <div>
                    <label for="username" class="block text-sm font-semibold text-slate-700 mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="far fa-user text-sm"></i>
                        </span>
                        <input type="text" 
                               class="block w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition duration-200 bg-slate-50/50 hover:bg-slate-50" 
                               id="username" 
                               name="username" 
                               required 
                               placeholder="Enter your username">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                            <i class="fas fa-lock text-sm"></i>
                        </span>
                        <input type="password" 
                               class="block w-full pl-10 pr-10 py-3 border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:ring-4 focus:ring-brand-500/10 transition duration-200 bg-slate-50/50 hover:bg-slate-50" 
                               id="password" 
                               name="password" 
                               required 
                               placeholder="Enter your password">
                        <button type="button" 
                                id="togglePassword" 
                                class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-brand-500 transition-colors duration-200">
                            <i class="far fa-eye text-sm" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3 px-4 rounded-xl font-bold transition-all duration-200 shadow-md shadow-brand-500/10 hover:shadow-lg hover:shadow-brand-500/20 active:scale-[0.98]">
                    Sign In
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // Password toggle functionality
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const eyeIcon = document.querySelector('#eye-icon');
    
    togglePassword.addEventListener('click', function() {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        
        if (type === 'password') {
            eyeIcon.className = 'far fa-eye text-sm';
        } else {
            eyeIcon.className = 'far fa-eye-slash text-sm';
        }
    });
</script>
{% endblock %}
