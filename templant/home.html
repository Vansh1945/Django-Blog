{% extends 'base.html' %}
{% block content %}

<style>
  .card-img-top {
      height: 220px;
      object-fit: cover;
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
  }
  .card {
      border: none;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      background: white;
  }
  .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.12);
  }
  .card-body {
      padding: 1.5rem;
  }
  .card-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 0.75rem;
      line-height: 1.4;
  }
  .author-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #6b46c1;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
  }
  .date-text {
      font-size: 0.85rem;
      color: #718096;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
  }
  .date-text i {
      margin-right: 6px;
      color: #a0aec0;
  }
  .btn-view {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-weight: 500;
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      transition: all 0.3s ease;
  }
  .btn-view:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
  }
  .btn-view i {
      margin-right: 8px;
  }
  .page-title {
      font-size: 2.5rem;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 2rem;
      position: relative;
      display: inline-block;
  }
  .page-title:after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 4px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 2px;
  }
  .no-blogs {
      font-size: 1.1rem;
      color: #718096;
      padding: 3rem;
      background: #f8f9fa;
      border-radius: 8px;
      text-align: center;
  }
  .row {
      margin-right: -15px;
      margin-left: -15px;
  }
  .col-lg-4 {
      padding: 15px;
  }
</style>

<div class="container py-5">
  <h2 class="page-title text-center mb-5">Our Blog Posts</h2>
  <div class="row">
      {% for blog in blogs %}
          <div class="col-lg-4 col-sm-6 mb-4">
              <div class="card h-100">
                  <a href="{% url 'blog_detail' blog.slug %}">
                      <img src="{{ blog.image.url }}" class="card-img-top" alt="{{ blog.title }}">
                  </a>
                  <div class="card-body">
                      <span class="author-tag">By {{ blog.user.username }}</span>
                      <h5 class="card-title">{{ blog.title }}</h5>
                      <p class="date-text">
                          <i class="far fa-clock"></i>
                          {{ blog.created_at|date:"M d, Y" }}
                      </p>
                      <a href="{% url 'blog_detail' blog.slug %}" class="btn btn-view">
                          <i class="fas fa-eye"></i> Read Article
                      </a>
                  </div>
              </div>
          </div>
      {% empty %}
          <div class="col-12">
              <div class="no-blogs">
                  <p>No blogs available yet. Check back soon!</p>
              </div>
          </div>
      {% endfor %}
  </div>
</div>
        
{% endblock %}
